---

- name: Prepare
  hosts: test-ag-certs-letsencrypt
  gather_facts: no
  tasks:
    - name: Installing nginx
      ansible.builtin.apt:
        name: 'nginx'
        update_cache: true

    - name: Starting nginx
      ansible.builtin.systemd:
        name: 'nginx.service'
        enabled: yes
        state: started

    - name: Checking if nginx is running
      ansible.builtin.wait_for:
        port: 80
        timeout: 4
